<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Equipment Monitoring</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>🏭 Vzdialený monitoring výrobných liniek</h1>
    <div id="status-badge" class="badge status-stopped">STOPPED</div>
  </header>

  <nav class="line-tabs" id="line-tabs"></nav>

  <main>
    <section class="metrics">
      <div class="card">
        <span class="card-label">Teplota</span>
        <span id="temp-value" class="card-value">--</span>
        <span class="card-unit">°C (cieľ: <span id="temp-setpoint">--</span>)</span>
      </div>
      <div class="card">
        <span class="card-label">Tlak</span>
        <span id="pressure-value" class="card-value">--</span>
        <span class="card-unit">bar (cieľ: <span id="pressure-setpoint">--</span>)</span>
      </div>
      <div class="card">
        <span class="card-label">Počet cyklov</span>
        <span id="cycle-value" class="card-value">--</span>
        <span class="card-unit"></span>
      </div>
    </section>

    <section class="chart-section">
      <canvas id="trend-chart" height="90"></canvas>
    </section>

    <section class="controls">
      <button id="start-btn">▶️ Štart linky</button>
      <button id="stop-btn">⏹️ Stop linky</button>
      <button id="restart-btn">🔄 Kvitovanie poruchy</button>
      <button id="export-btn">⬇️ Export CSV</button>
      <span id="control-feedback"></span>
    </section>

    <section class="setpoints">
      <h2>Cieľové hodnoty</h2>
      <label>
        Teplota (°C)
        <input type="number" id="setpoint-temp-input" step="0.5" />
      </label>
      <label>
        Tlak (bar)
        <input type="number" id="setpoint-pressure-input" step="0.1" />
      </label>
      <button id="apply-setpoint-btn">Nastaviť</button>
      <span id="setpoint-feedback"></span>
    </section>

    <section class="alarms">
      <h2>Log alarmov</h2>
      <table id="alarms-table">
        <thead>
          <tr><th>Čas</th><th>Správa</th><th>Kvitované</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/dashboard.js"></script>
</body>
</html>
